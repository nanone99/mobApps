<ion-header>
  <ion-toolbar>
    <ion-title>{{ person?.name }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="person">

  <ion-card>
    <img *ngIf="person.profile_path" [src]="'https://image.tmdb.org/t/p/w500' + person.profile_path" width="140"/>

    <ion-card-header>
      <ion-card-title>{{ person.name }}</ion-card-title>
      <ion-card-subtitle>
        Born: {{ person.birthday }} <br>
        <span *ngIf="person.deathday">Died: {{ person.deathday }}</span>
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p><strong>Also Known As:</strong></p>
      <p *ngFor="let aka of person.also_known_as">{{ aka }}</p>

      <p><strong>Biography:</strong></p>
      <p>{{ person.biography }}</p>
    </ion-card-content>
  </ion-card>

  <h2>Other Movies</h2>

  <ion-list>
    <ion-item *ngFor="let movie of movies" (click)="openMovie(movie.id)">
      <ion-label>
        {{ movie.title }}
      </ion-label>
  
      <ion-thumbnail slot="end">
        <ion-img
          *ngIf="movie.poster_path"
          [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path"
        ></ion-img>
      </ion-thumbnail>
    </ion-item>
  </ion-list>
  
  

</ion-content>
