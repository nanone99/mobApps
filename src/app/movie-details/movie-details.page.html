<!-- This html is to display the movie title on the top and then add the home, favourites icon that will trigger the navigation methods below -->
<ion-header *ngIf="movieDetails">
  <ion-toolbar style="--background: #032541; color: white;">
    <ion-title>{{ movieDetails.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="goToFavourites()">
        <ion-icon slot="icon-only" name="heart" olor="light"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="goHome()">
        <ion-icon slot="icon-only" name="home" olor="light"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- This will ensure that all the formatting is consistent in all the page -->
<ion-content class="ion-no-padding" style="--background: #032541; color: white;">
  <!-- This will display the button to trigger addToFavourites method which saves the movie into storage -->
  <ion-button  shape="round" expand="block" color="primary" (click)="addToFavourites()">Add To Favourites</ion-button>
  <!-- This injects the data biding that shows the overview of the movie -->
   <ng-container *ngIf="movieDetails">
    <ion-card style="background: #0a3a63; color: white; border-radius: 12px; margin: 16px;">
      <ion-card-content>
        <p style="font-size: 18px; line-height: 1.6;">{{ movieDetails.overview }}</p>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <!-- Horizontal Scrolls Section -->

  <!-- Source: https://www.geeksforgeeks.org/css/make-a-div-horizontally-scrollable-using-css/
  This will display the cast information in a horizontal scroll -->
  <h2 style="color: white;">Cast</h2>
  <div style="display: flex;overflow-x: auto;overflow-y: hidden;gap: 15px;padding: 10px 0;white-space: nowrap;">
    
    <!-- The following section is to display the cast from the API call it also includes an else statement to display the no picture from assets -->
    <ion-card *ngFor="let actor of cast" (click)="openPerson(actor.id)"
      style="display: inline-block; min-width: 150px; flex-shrink: 0;text-align: center;cursor: pointer;background: transparent; box-shadow: none;padding: 0;margin: 0;border: none;">
        <img *ngIf="actor.profile_path; else noActorImage"
           [src]="'https://image.tmdb.org/t/p/w500' + actor.profile_path"
           style="width: 150px; height: 225px; object-fit: cover;" />
  
      <!-- This logic if for the else above to take the movie from assets if a image isn't available controlled by the ngFor above -->     
      <ng-template #noActorImage>
        <img src="assets/no-image.png"
             style="width: 150px; height: 225px; object-fit: cover;" />
      </ng-template>
      <ion-card-header>
        <ion-card-title style="color: white;">{{ actor.character }}</ion-card-title>
      </ion-card-header>
    </ion-card>
  </div>
  
  <!-- Source: https://www.geeksforgeeks.org/css/make-a-div-horizontally-scrollable-using-css/
  This will display the cast information in a horizontal scroll -->
  <h2 style="color: white;">Crew</h2>
  <div style="display: flex;overflow-x: auto;overflow-y: hidden;padding: 10px 0;white-space: nowrap;">
  <!-- The following section is to display the crew from the API call it also includes an else statement to display the no picture from assets -->
  <ion-card *ngFor="let member of crew"
  style="display: inline-block; min-width: 150px; flex-shrink: 0;text-align: center;cursor: pointer;background: transparent; box-shadow: none;padding: 0;margin: 0;border: none;"
    (click)="openPerson(member.id)">
    <img *ngIf="member.profile_path; else noCrewImage"
         [src]="'https://image.tmdb.org/t/p/w500' + member.profile_path"
         style="width: 150px; height: 225px; object-fit: cover;" />
    <!-- This logic if for the else above to take the movie from assets if a image isn't available controlled by the ngFor above -->     
    <ng-template #noCrewImage>
      <img src="assets/no-image.png"
           style="width: 150px; height: 225px; object-fit: cover;" />
    </ng-template>
    <ion-card-header>
      <ion-card-title style="color: white;">{{ member.job }}</ion-card-title>
    </ion-card-header>
  </ion-card>
</div>

<!-- Source: https://www.geeksforgeeks.org/css/make-a-div-horizontally-scrollable-using-css/
  THis is carbon copy of the other horizontal controls but for the trailers -->
<h2 style="color: white;">Trailers</h2>
<div div style="display: flex; overflow-x: auto; overflow-y: hidden; gap: 15px; padding: 10px 0; white-space: nowrap;">
  <!--his will iterate on the trailers array and and then trigger openTrailer function which will open the video directly on youtube on a new window -->
  <ion-card *ngFor="let t of trailers"
  style="display: inline-block; min-width: 360px; flex-shrink: 0;text-align: center;cursor: pointer;background: transparent; box-shadow: none;padding: 0;margin: 0;border: none;"
  (click)="openTrailer(t.key)">
    <!-- https://blog.devinschumacher.com/how-to-get-a-youtube-video-thumbnail-image-easily-all-you-need-is-the-youtube-video-link
     This link will bring the key and load the thumbail into the app. Original idea was to embeed the video but first issue i found is that you had to 
     make the link safe, otherwise youtube would not provide access and then i encountered the issue with the crash of angular and ionic due to the size
     so after looking online, i found this way to only keep the image that comes from youtube and then just open it separately -->
            <img [src]="'https://img.youtube.com/vi/' + t.key + '/maxresdefault.jpg'"
            style="width: 360px;height: 215px;object-fit: cover;border-radius: 10px;display: block;margin-left: auto;margin-right: auto;"/>
      <ion-card-header>
        <ion-card-title style="color: white;">{{ t.name }}</ion-card-title>
      </ion-card-header>
    </ion-card> 
  </div>
